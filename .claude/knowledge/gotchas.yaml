# Gotchas registry. Each entry: an id, trigger globs/keywords, and a rule.
# The orchestrator matches triggers against the request + diff; matched rules
# are surfaced to specialists before they start work.

- id: root-token-scoping
  triggers:
    files:
      - "app/globals.css"
      - "components/**/*.tsx"
      - "app/**/*.tsx"
    keywords:
      - "--ab-"
      - "--sup-"
      - ".ab-root"
      - ".sup-root"
      - ".ab-prose"
      - ".ab-legal-"
      - ".ab-nf-"
      - "data-theme"
      - "data-app"
  rule: >-
    Tokens prefixed --ab-* live ONLY under .ab-root (homepage AND the legal-
    page chrome via .ab-legal-* / .ab-prose AND the 404 chrome via .ab-nf-*,
    all scoped under .ab-root in globals.css). Tokens prefixed --sup-* live
    ONLY under .sup-root (support pages, data-app="fingo" or "savely").
    Neither set may leak across. Global HSL tokens (--background,
    --foreground, --border, etc.) live in :root and .dark; they're consumed
    by Tailwind's theme extension. When a new component needs a color, first
    decide which scope it lives in, then reach for that scope's prefixed
    vars. Do not redeclare the same token name under both roots — extract to
    :root instead.
  source: "CLAUDE.md#4-design-system"

- id: i18n-pattern-canonical
  triggers:
    files:
      - "app/**/*.tsx"
      - "components/**/*.tsx"
      - "messages/*.json"
    keywords:
      - "useTranslations"
      - "getTranslations"
      - "isSpanish"
      - "next-intl"
      - "useParams"
      - "NextIntlClientProvider"
      - "CONTENT["
  rule: >-
    Canonical i18n: useTranslations() in Client Components, getTranslations()
    in Server Components. Keys in messages/en.json + messages/es.json. Top-
    level namespaces in use today: notFound, layout, legal, home, support
    (with support.fingo and support.savely). The migration is FULLY COMPLETE
    as of 2026-04-26 — homepage (PR #9), locale layout (PR #9), legal trio
    (PR #12), 404 (PR #18), Fingo support (PR #23), Savely support (PR #25).
    Zero `isSpanish` ternaries and zero `Record<Lang, ...>` / `CONTENT[locale]`
    dictionaries remain in the source tree. NEVER reintroduce
    `const isSpanish = locale === 'es'` or any equivalent ternary against a
    translation string, and NEVER inline a per-locale content dictionary in
    a TSX file. New copy always goes through next-intl keys.
    useParams().locale is still acceptable for routing logic (href
    construction, switchLocale helper, language-code chip labels) — that is
    not a translation concern. For rich strings with embedded JSX, use ICU
    placeholder tags in the dictionary value and t.rich(key, { tag: chunks
    => <em>{chunks}</em> }) in the consumer. For values consumed via
    dangerouslySetInnerHTML (support pages), use t.raw(key) — see gotcha
    next-intl-html-via-t-raw.
  source: "CLAUDE.md#5-i18n"

- id: next-intl-html-via-t-raw
  triggers:
    files:
      - "app/**/*.tsx"
      - "components/**/*.tsx"
      - "messages/*.json"
    keywords:
      - "t.raw"
      - "dangerouslySetInnerHTML"
      - "Html"
      - "valueHtml"
      - "titleHtml"
      - "aHtml"
      - "FORMATTING_ERROR"
  rule: >-
    next-intl's ICU formatter parses tag-shaped substrings inside translation
    values as TAG PLACEHOLDERS, not literal HTML. A value like
    "How can we <em>help?</em>" read via t("hero.titleHtml") throws
    FORMATTING_ERROR at render — the formatter expects you to bind an `em`
    chunks function via t.rich(). Two correct shapes in this codebase:
    (1) When the consumer renders into JSX with embedded React components,
    use ICU placeholder tags in the value and t.rich(key, { tag: chunks =>
    <em>{chunks}</em> }). (2) When the consumer renders the string via
    dangerouslySetInnerHTML (support pages — heroTitle, contactTitle,
    contact.cards.*.value, faq.items.*.aHtml, status.titleHtml, cta.titleHtml,
    etc.), use t.raw(key) which returns the raw string untouched, and name
    the key with an `Html` suffix as the discoverability cue (`heroTitleHtml`,
    `valueHtml`, `aHtml`, `titleHtml`). Arrays in the dictionary
    (faq.items, status.rows) are also read via t.raw(key) — t() would try to
    interpolate them. Discovered in PR #23 (Fingo migration), applied from
    the start in PR #25 (Savely migration).
  source: "CLAUDE.md#5-i18n"

- id: not-found-catch-all-required
  triggers:
    files:
      - "app/[locale]/not-found.tsx"
      - "app/[locale]/[...rest]/page.tsx"
      - "app/[locale]/_not-found-controls.tsx"
      - "app/**/*.tsx"
    keywords:
      - "notFound"
      - "not-found"
      - "[...rest]"
      - "ab-nf-"
  rule: >-
    Two load-bearing facts about Next 15.2.4 App Router 404 handling in this
    project: (1) A segment-level not-found.tsx ONLY fires when notFound() is
    called programmatically — it does NOT auto-fire for raw URLs that don't
    match any route. The catch-all at app/[locale]/[...rest]/page.tsx exists
    SPECIFICALLY to intercept unmatched URLs under /[locale]/* and call
    notFound() so the editorial 404 renders. Do not delete it. (2) On Next
    15.2.4, server-thrown notFound() does NOT cleanly render a Client
    not-found.tsx — the framework falls back to its default 404 chrome.
    Therefore not-found.tsx MUST be a Server Component (using
    getTranslations() + getLocale()), with any interactivity isolated in a
    Client island (currently app/[locale]/_not-found-controls.tsx for the
    theme + locale toggles). PR #17 shipped a single Client-Component 404
    that worked in dev but broke on Amplify; PR #18 split it into the
    current Server + island shape and added the catch-all. PR #18 was
    Amplify-verified on the user's deploy. If you change anything in this
    region, smoke on /en/this-route-does-not-exist and /es/this-route-does-not-exist
    in pnpm dev AND on an Amplify preview before merging to main.
  source: "CLAUDE.md#3-architecture"

- id: amplify-images-unoptimized
  triggers:
    files:
      - "next.config.mjs"
      - "app/**/*.tsx"
      - "components/**/*.tsx"
    keywords:
      - "images"
      - "unoptimized"
      - "next/image"
      - "<Image"
  rule: >-
    next.config.mjs sets images.unoptimized: true. This is load-bearing for
    Amplify — the hosted image optimizer does not match Next/Image's sharp-
    based defaults, so optimized images come back 404 or broken. Do NOT
    remove this setting, and be cautious about replacing <img> with
    next/image without first verifying the Amplify build still serves the
    asset. Visual smoke on /en and /es required for any image-related change.
  source: "CLAUDE.md#6-amplify-quirks"

- id: amplify-client-component-quirk
  triggers:
    files:
      - "app/[locale]/layout.tsx"
      - "app/[locale]/not-found.tsx"
      - "app/[locale]/[...rest]/page.tsx"
      - "app/**/*.tsx"
      - "middleware.ts"
      - "next.config.mjs"
      - "i18n.ts"
    keywords:
      - "NextIntlClientProvider"
      - "getMessages"
      - "getTranslations"
      - "useTranslations"
      - "unstable_setRequestLocale"
      - "serverExternalPackages"
      - "createNextIntlPlugin"
      - "notFound"
  rule: >-
    Current Amplify-verified setup: app/[locale]/layout.tsx wraps {children}
    in NextIntlClientProvider with messages from getMessages(), and calls
    unstable_setRequestLocale(locale) before any getTranslations/getMessages
    read (PR #9). The provider is required for Client Component
    useTranslations() to work; setRequestLocale is required to keep all
    named routes statically prerendered. createNextIntlPlugin('./i18n.ts')
    wraps the next.config.mjs export. serverExternalPackages: ['next-intl']
    was REMOVED in PR #9 — it was redundant with the plugin and prevented
    useTranslations() from resolving the react-server export at SSG. The
    catch-all app/[locale]/[...rest]/page.tsx + Server-Component
    app/[locale]/not-found.tsx + Client island
    app/[locale]/_not-found-controls.tsx shape (PR #18) is also
    Amplify-verified. The historical break (commit 5719a20, 2025-08-13, on
    Next 14) no longer reproduces on Next 15.2.4 + React 19. FORWARD-LOOKING
    RULE: if you change anything about the provider position, message
    loading, setRequestLocale call, the next-intl plugin wiring, or the
    not-found split — smoke-test on an Amplify deploy preview before
    merging to main. Do NOT trust local pnpm build alone for changes in
    this region.
  source: "CLAUDE.md#6-amplify-quirks"

- id: dead-deps-removal-dedicated-pr
  triggers:
    files:
      - "package.json"
      - "pnpm-lock.yaml"
    keywords:
      - "pnpm remove"
      - "pnpm add"
      - "next-themes"
      - "sonner"
      - "three"
      - "framer-motion"
      - "@react-three"
      - "lucide-react"
  rule: >-
    Three dep-removal waves shipped to date: PR #6 (2026-04-25) dropped six
    packages orphaned by the editorial redesign (three, @react-three/fiber,
    @react-three/drei, framer-motion, react-parallax-tilt, @types/three);
    PR #11 (2026-04-25) dropped two more orphaned by the shadcn scaffold
    deletion (next-themes, sonner); PR #20 (2026-04-26) dropped lucide-react
    after the legacy 404 was redesigned in PR #18. All three followed the
    dedicated-PR pattern; the workflow is now battle-tested. Going forward,
    ANY dep removal must be its own PR — never bundled with unrelated
    feature or refactor work. Before shipping a dep removal: (1) grep the
    source tree for every import of the package
    ('grep -rE "from ['\"]<pkg>" app components' — note that lib/, hooks/,
    and components/ui/ no longer exist), (2) run pnpm build to confirm
    compile, (3) load /en/ and /es/ in pnpm dev as visual smoke, (4) commit
    with a message naming what was removed and why.
  source: "CLAUDE.md#7-dead-dependencies"

- id: google-fonts-hybrid-loading
  triggers:
    files:
      - "app/globals.css"
      - "app/[locale]/layout.tsx"
    keywords:
      - "@import"
      - "fonts.googleapis.com"
      - "next/font"
      - "Inter"
      - "Fraunces"
      - "EB Garamond"
      - "Instrument Serif"
      - "IBM Plex Mono"
  rule: >-
    Fonts load two ways on purpose. @import in globals.css (line 1) ships
    Fraunces, Inter, EB Garamond, Instrument Serif, and IBM Plex Mono for
    CSS-level font-family references. next/font/google in
    app/[locale]/layout.tsx ALSO loads Inter as --font-inter (exposed via
    <html className={inter.variable}>) to benefit from Next's font
    subsetting and preload for body copy. Coexistence is intentional — do
    not collapse one into the other without measuring. When adding a new
    family, prefer next/font for any weight you actually use, and leave
    @import for display-only CSS references.
  source: "CLAUDE.md#3-architecture"

- id: pnpm-is-package-manager
  triggers:
    files:
      - "package.json"
      - "pnpm-lock.yaml"
    keywords:
      - "npm install"
      - "yarn add"
      - "npm run"
      - "yarn "
      - "npx "
  rule: >-
    Package manager is pnpm. Never suggest npm install / yarn add /
    npx <cmd>. Always pnpm install, pnpm add, pnpm remove, pnpm dlx. The
    lockfile is pnpm-lock.yaml — do not commit package-lock.json or
    yarn.lock. There is no typecheck script in package.json — use
    pnpm exec tsc --noEmit directly. `pnpm lint` IS a real check as of
    PR #22 (.eslintrc.json extends next/core-web-vitals); the build still
    ignores lint errors via next.config.mjs.eslint.ignoreDuringBuilds, but
    the standalone command runs clean and should stay that way.
  source: "CLAUDE.md#2-commands"

- id: client-component-env-vars
  triggers:
    files:
      - "app/**/*.tsx"
      - "components/**/*.tsx"
      - ".env*"
      - "next.config.mjs"
    keywords:
      - "use client"
      - "process.env"
      - "NEXT_PUBLIC_"
  rule: >-
    Only env vars prefixed NEXT_PUBLIC_* are visible in Client Components
    (files marked 'use client' or transitively imported from one). Any
    server-only secret — API keys, DB URLs, Amplify tokens — referenced in
    a Client Component will be inlined into the client bundle and leaked to
    the browser. When in doubt, move the secret-using code to a Server
    Component or Route Handler and expose only the non-secret result to
    the client.
  source: "CLAUDE.md#6-amplify-quirks"

- id: case-studies-single-file
  triggers:
    files:
      - "app/[locale]/page.tsx"
      - "messages/en.json"
      - "messages/es.json"
    keywords:
      - "CaseKey"
      - "CASES"
      - "indexInfo"
      - "CasePreview"
      - "cases."
  rule: >-
    All six case studies (fingo, savely, mezcal, blip, briefmark, pass) live
    in app/[locale]/page.tsx — no per-case routes. A new case touches five
    places: the CaseKey union, the CASES useMemo record, the indexInfo lookup
    in Selected Work, a CasePreview branch, and cases.<key> in BOTH
    messages/en.json and messages/es.json (missing keys throw at runtime via
    next-intl). blip/briefmark/pass previews are styled placeholders reusing
    ab-browser-frame + ab-mez-site — swap for real screenshots in public/
    when available. The modal's web-preview class comes from an includes()
    list of browser-frame keys — keep it in sync when adding previews.

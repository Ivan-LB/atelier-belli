# Mirrors the Amplify production build so a broken deploy fails HERE (red X on
# the PR + email to the author) instead of failing silently on Amplify and
# leaving the live site frozen on a stale build.
#
# Two things make this a FAITHFUL mirror of Amplify — both learned the hard way:
#   1. pnpm is installed with `npm install -g pnpm` (LATEST), exactly like
#      Amplify. Pinning a version here once produced a false green: the pinned
#      pnpm still read a config format that the newer pnpm on Amplify ignored.
#      Tracking latest means a pnpm behavior/format change fails the PR first.
#   2. The pnpm store is NOT cached. A cold store forces pnpm to evaluate every
#      dependency's build scripts (ERR_PNPM_IGNORED_BUILDS surfaces here), just
#      like Amplify's fresh build environment.
name: Build check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Install + verify + production build (mirrors Amplify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20 # matches .nvmrc / package.json engines

      - name: Install pnpm (latest, exactly like Amplify)
        run: npm install -g pnpm

      - name: Install dependencies
        # --frozen-lockfile fails if pnpm-lock.yaml drifts from package.json.
        # On a cold store this also runs dependency build scripts, so an
        # unapproved script exits non-zero and fails the check — the exact
        # signal Amplify was swallowing.
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + i18n parity)
        # The production build has typescript.ignoreBuildErrors and
        # eslint.ignoreDuringBuilds ON, so `pnpm build` alone would ship
        # type/lint errors. Running verify here is stricter than Amplify.
        run: pnpm verify

      - name: Production build
        run: pnpm build
